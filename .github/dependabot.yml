version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    # Hard cap: at most 2 open Dependabot PRs at any time (one dev, one prod)
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      # All dev dependencies in one PR
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # All production dependencies in one PR
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
